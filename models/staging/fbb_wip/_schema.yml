version: 2

models:
  - name: stg_land__fbb_products_wip
    description: "View from LAND database for FBB products"

    columns:
      - name: PRODUCT_ID
        description: "This is the SFCC product id"
      - name: MF_MASTER_ITEM_ID
        description: "This is the Mainframe master id"
      - name: BRAND_ID
        description: "This is the brand id as number"
      - name: MF_DEPARTMENT
        description: "This is the Mainframe department id as number"
      - name: CLASSIFICATION_ID
        description: "This is the SFCC classification id as number"
      - name: SFFC_CATEGORY_ID
        description: "This is the SFCC category id as string"
      - name: TITLE
        description: "This is the products short title"
      - name: SFCC_URL
        description: "This is the SFFC url directing to ww site"
      - name: IS_PURGED
        description: "Boolean that indicates if the product is purged"
      - name: STATUS
        description: "The stats of the product 1-ACTIVE, 2-INACTIVE, 3-PURGED"
      - name: CREATED_AT
        description: "Date that the product was created"
      - name: UPDATED_AT
        description: "Date that the product was updated"
      - name: MF_UPDATED_AT
        description: "Date the product was updated in Mainframe"
      - name: PCM_UPDATED_AT
        description: "Date the product was updated in PCM"

