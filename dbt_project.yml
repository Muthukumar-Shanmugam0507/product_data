name: 'product_data'
version: '1.6.6'
config-version: 2

profile: 'product-data'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

packages-install-path: /tmp/dbt_packages

clean-targets:
  - "target"
  - "dbt_packages"

snapshots:
  product_data:
    +target_schema: PRODUCT_DATA_MANAGEMENT
    fbb_wip:
      +target_schema: PRODUCT_DATA_MANAGEMENT_WIP

models:
  product_data:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
    
    # WIP schema - all models go to PRODUCT_DATA_MANAGEMENT_WIP
    fbb_wip:
      +schema: PRODUCT_DATA_MANAGEMENT_WIP